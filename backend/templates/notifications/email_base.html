<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block subject %}Hasker &amp; Co. Realty Group{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!--[if mso]>
  <style>* { font-family: Arial, sans-serif !important; }</style>
  <![endif]-->
  <style>
    body { margin: 0; padding: 0; background-color: #f4f2ee; }
    img  { border: 0; display: block; }
    a    { text-decoration: none; }
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 0 !important; }
      .email-card    { width: 100% !important; }
      .content-pad   { padding: 32px 24px !important; }
      .footer-pad    { padding: 20px 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f2ee;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f2ee;">
  <tr>
    <td align="center" style="padding:48px 16px 56px;" class="email-wrapper">
      <table width="580" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;width:100%;" class="email-card">

        <!-- ── HEADER ─────────────────────────────────────────── -->
        <tr>
          <td style="background-color:#ffffff;padding:32px 48px 28px;border-bottom:1px solid #ebebeb;" class="content-pad">
            <img
              src="https://haskerrealtygroup.com/logo/logo.png"
              alt="Hasker &amp; Co. Realty Group"
              height="38"
              style="display:block;height:38px;width:auto;max-width:180px;"
            />
          </td>
        </tr>

        <!-- ── BODY ───────────────────────────────────────────── -->
        <tr>
          <td style="background-color:#ffffff;padding:44px 48px 40px;" class="content-pad">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- ── FOOTER ─────────────────────────────────────────── -->
        <tr>
          <td style="background-color:#ffffff;padding:20px 48px 28px;border-top:1px solid #ebebeb;" class="footer-pad">
            <p style="margin:0 0 4px;font-size:11px;color:#b0b0b0;line-height:1.6;">
              &copy; {% now "Y" %} Hasker &amp; Co. Realty Group. All rights reserved. &nbsp;&bull;&nbsp; Licensed Real Estate Professionals &nbsp;&bull;&nbsp; Equal Housing Opportunity
            </p>
            <p style="margin:0;font-size:11px;color:#c8c8c8;line-height:1.6;">
              Questions? <a href="mailto:info@haskerrealtygroup.com" style="color:#b0b0b0;text-decoration:none;">info@haskerrealtygroup.com</a> &nbsp;&bull;&nbsp; <a href="tel:+17572082767" style="color:#b0b0b0;text-decoration:none;">+1 (757) 208-2767</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
