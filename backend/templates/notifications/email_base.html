<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block subject %}Hasker &amp; Co. Realty Group{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <!--[if mso]><style>* { font-family: Arial, sans-serif !important; }</style><![endif]-->
  <style>
    body  { margin: 0; padding: 0; background-color: #E8E5DC; }
    img   { border: 0; display: block; }
    a     { text-decoration: none; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    @media only screen and (max-width: 600px) {
      .email-outer  { padding: 24px 0 40px !important; }
      .header-cell  { padding: 18px 22px !important; }
      .content-cell { padding: 32px 24px !important; }
      .footer-cell  { padding: 24px 22px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#E8E5DC;-webkit-font-smoothing:antialiased;font-family:'DM Sans',Arial,sans-serif;">

{% load i18n %}

<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#E8E5DC">
  <tr>
    <td align="center" style="padding:48px 16px 64px;" class="email-outer">

      <!-- EMAIL CARD -->
      <table width="580" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;width:100%;background-color:#ffffff;border:1px solid #F1F5F9;box-shadow:0 8px 32px rgba(11,31,58,0.07),0 2px 6px rgba(11,31,58,0.04);">

        <!-- ── HEADER ───────────────────────────────────────── -->
        <tr>
          <td bgcolor="#ffffff" style="padding:24px 40px 20px;border-bottom:1px solid #F1F5F9;" class="header-cell">
            <table cellpadding="0" cellspacing="0" border="0">
              <tr>
                <!-- Diamond mark on navy square -->
                <td style="vertical-align:middle;padding-right:10px;">
                  <table width="34" height="34" cellpadding="0" cellspacing="0" border="0" bgcolor="#0B1F3A" style="border-radius:2px;">
                    <tr><td align="center" valign="middle">
                      <svg width="20" height="20" viewBox="0 0 32 32" style="display:block;">
                        <polygon points="3,16 16,3 29,16 16,29" fill="#1A56DB"/>
                        <polygon points="9,16 16,9 23,16" fill="#FFFFFF"/>
                        <rect x="9" y="16" width="14" height="10" fill="#FFFFFF"/>
                        <rect x="14" y="19" width="4" height="7" fill="#1A56DB"/>
                      </svg>
                    </td></tr>
                  </table>
                </td>
                <!-- Wordmark -->
                <td style="vertical-align:middle;">
                  <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:800;font-size:14px;letter-spacing:-0.02em;color:#0B1F3A;line-height:1;">HASKER &amp; CO.</div>
                  <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:8px;font-weight:400;letter-spacing:0.25em;color:#1A56DB;margin-top:3px;line-height:1;">REALTY GROUP</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ── HERO IMAGE (optional, per-template) ─────────── -->
        {% block hero_image %}{% endblock %}

        <!-- ── BODY ─────────────────────────────────────────── -->
        <tr>
          <td bgcolor="#ffffff" style="padding:40px 40px 36px;" class="content-cell">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- ── FOOTER ───────────────────────────────────────── -->
        <tr>
          <td bgcolor="#FBF9F4" align="center" style="padding:28px 40px 28px;border-top:1px solid #F1F5F9;" class="footer-cell">

            <!-- Social row -->
            <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 16px;">
              <tr>
                <td style="padding:0 4px;">
                  <a href="https://www.instagram.com/haskerrealtygroup/" aria-label="Instagram" style="display:inline-block;width:30px;height:30px;border-radius:9999px;border:1px solid #CBD5E1;text-align:center;text-decoration:none;">
                    <svg width="30" height="30" viewBox="0 0 30 30" style="display:block;">
                      <rect x="8.5" y="8.5" width="13" height="13" rx="3.5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
                      <circle cx="15" cy="15" r="3" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
                      <circle cx="19" cy="11" r="0.9" fill="#94A3B8"/>
                    </svg>
                  </a>
                </td>
                <td style="padding:0 4px;">
                  <a href="#" aria-label="Facebook" style="display:inline-block;width:30px;height:30px;border-radius:9999px;border:1px solid #CBD5E1;text-align:center;text-decoration:none;">
                    <svg width="30" height="30" viewBox="0 0 30 30" style="display:block;">
                      <path d="M17.5 12H16c-.28 0-.5.22-.5.5V14h2l-.3 1.8H15.5V20h-2v-4.2H12V14h1.5v-1.5c0-1.54 1.12-2.5 2.5-2.5H17.5V12z" fill="#94A3B8"/>
                    </svg>
                  </a>
                </td>
                <td style="padding:0 4px;">
                  <a href="#" aria-label="LinkedIn" style="display:inline-block;width:30px;height:30px;border-radius:9999px;border:1px solid #CBD5E1;text-align:center;text-decoration:none;">
                    <svg width="30" height="30" viewBox="0 0 30 30" style="display:block;">
                      <path d="M11 19.5v-6.2h2v6.2H11zm1-7.1a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3zM19.5 19.5H17.6v-3.2c0-.9-.35-1.5-1.15-1.5-.62 0-1 .42-1.16.83-.06.15-.08.34-.08.54v3.33H13.3s.03-5.4 0-6h2v.85c.27-.42.75-1.02 1.83-1.02 1.34 0 2.34.87 2.34 2.75v3.42z" fill="#94A3B8"/>
                    </svg>
                  </a>
                </td>
              </tr>
            </table>

            <!-- Divider -->
            <div style="width:32px;height:1px;background-color:#E2E8F0;margin:0 auto 14px;"></div>

            <!-- Legal -->
            <p style="margin:0 0 4px;font-family:'DM Sans',Arial,sans-serif;font-size:11px;color:#94A3B8;line-height:1.6;">
              &copy; {% now "Y" %} Hasker &amp; Co. Realty Group &nbsp;&bull;&nbsp; Equal Housing Opportunity
            </p>
            <p style="margin:0;font-family:'DM Sans',Arial,sans-serif;font-size:11px;color:#94A3B8;line-height:1.6;">
              Questions? <a href="mailto:info@haskerrealtygroup.com" style="color:#64748B;text-decoration:none;">info@haskerrealtygroup.com</a>
              &nbsp;&bull;&nbsp;
              <a href="tel:+17572082767" style="color:#64748B;text-decoration:none;">(757) 208-2767</a>
            </p>
          </td>
        </tr>

      </table><!-- /email card -->
    </td>
  </tr>
</table><!-- /wrapper -->

</body>
</html>
